{% extends "base.html" %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-4 p-5 bg-white">
                <i class="bi bi-question-circle display-1 text-primary mb-3"></i>
                <h1 class="display-5 fw-bold">404</h1>
                <h4 class="fw-bold mb-2">Page Not Found</h4>
                <p class="text-muted mb-4">
                    The article, category, or page you are looking for does not exist or may have been moved.
                </p>
                <div>
                    <a href="{{ url_for('main.index') }}" class="btn btn-primary rounded-pill px-4">
                        <i class="bi bi-house me-1"></i> Return Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
