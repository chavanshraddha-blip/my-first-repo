{% extends "base.html" %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-4 p-5 bg-white">
                <i class="bi bi-exclamation-triangle display-1 text-warning mb-3"></i>
                <h1 class="display-5 fw-bold">500</h1>
                <h4 class="fw-bold mb-2">Internal Server Error</h4>
                <p class="text-muted mb-4">
                    Something went wrong on our server. Our team has been notified. Please try again shortly.
                </p>
                <div>
                    <a href="{{ url_for('main.index') }}" class="btn btn-primary rounded-pill px-4">
                        <i class="bi bi-house me-1"></i> Return Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
