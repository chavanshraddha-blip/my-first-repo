{% extends "base.html" %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-4 p-5 bg-white">
                <i class="bi bi-shield-slash display-1 text-danger mb-3"></i>
                <h1 class="display-5 fw-bold">403</h1>
                <h4 class="fw-bold mb-2">Access Forbidden</h4>
                <p class="text-muted mb-4">
                    You do not have permission to access or modify this resource. If this is your post, please verify your account.
                </p>
                <div>
                    <a href="{{ url_for('main.index') }}" class="btn btn-primary rounded-pill px-4">
                        <i class="bi bi-house me-1"></i> Return Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
